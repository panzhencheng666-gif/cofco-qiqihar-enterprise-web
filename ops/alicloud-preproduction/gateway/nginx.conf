worker_processes auto;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;

  log_format structured escape=json
    '{"time":"$time_iso8601","request_id":"$request_id",'
    '"method":"$request_method","uri":"$uri","status":$status,'
    '"bytes":$body_bytes_sent,"request_time":$request_time,'
    '"upstream_time":"$upstream_response_time"}';
  access_log /dev/stdout structured;
  error_log /dev/stderr warn;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
  }

  upstream business_web {
    server business-web:8080;
    keepalive 16;
  }

  upstream overview_web {
    server overview-web:8080;
    keepalive 16;
  }

  upstream backend_api {
    server backend:8090;
    keepalive 32;
  }

  server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate /run/secrets/tls.crt;
    ssl_certificate_key /run/secrets/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    client_max_body_size 21m;

    # Only Spring OIDC and its HttpOnly session establish identity. Strip all
    # local, legacy, and proxy-auth identity headers before every upstream.
    proxy_set_header X-Actor "";
    proxy_set_header X-Qiqihar-Authenticated-Subject "";
    proxy_set_header X-Authenticated-Subject "";
    proxy_set_header X-Remote-User "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-Id $request_id;
    proxy_hide_header X-Powered-By;

    location = /healthz {
      access_log off;
      add_header Cache-Control "no-store" always;
      return 200 "ok\n";
    }

    location = /prototype.html {
      add_header Cache-Control "no-store" always;
      return 404;
    }

    location ^~ /api/ {
      proxy_pass http://backend_api;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_read_timeout 65s;
    }

    location ^~ /oauth2/ {
      proxy_pass http://backend_api;
      proxy_http_version 1.1;
    }

    location ^~ /login/oauth2/ {
      proxy_pass http://backend_api;
      proxy_http_version 1.1;
    }

    location ^~ /logout/connect/back-channel/ {
      proxy_pass http://backend_api;
      proxy_http_version 1.1;
    }

    location ^~ /overview-monitoring/ {
      proxy_pass http://overview_web/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }

    location ^~ /overview/ {
      proxy_pass http://overview_web/overview/;
      proxy_http_version 1.1;
    }

    location / {
      proxy_pass http://business_web;
      proxy_http_version 1.1;
    }
  }
}
