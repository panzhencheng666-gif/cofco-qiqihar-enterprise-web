global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8090"]

  - job_name: blackbox-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://business-web:8080/healthz
          - http://overview-web:8080/healthz
          - http://backend:8090/actuator/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: probe_success|probe_duration_seconds|probe_ssl_earliest_cert_expiry
        action: keep

  - job_name: blackbox-oidc
    metrics_path: /probe
    params:
      module: [http_oidc_redirect]
    static_configs:
      - targets:
          - http://backend:8090/api/v1/session/login
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # The https_2xx module is activated only after EXT-005 supplies the approved
  # rendered TLS target. Until then certificate metrics remain absent and the
  # Stage9RequiredMetricMissing alert intentionally fails closed.

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
