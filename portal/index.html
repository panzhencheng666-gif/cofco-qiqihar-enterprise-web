<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <link rel="stylesheet" href="portal.css?v=selected-depth-7" />

  <body>
    <a class="skip" href="#main">跳至正文</a>
    <div class="utility">
      <div>齐齐哈尔粮食商情企业平台<span>独立首页预览</span></div>
    </div>
    <header>
      <a class="brand" href="#/" aria-label="平台首页"

          ></span

      ><button class="menu-toggle" aria-expanded="false" aria-controls="nav">
        菜单
      </button>
      <nav id="nav" aria-label="平台导航">
        <a href="#/">首页</a><a href="#/applications">应用中心</a
        ><a href="#/support">服务支持</a><a href="#/about">关于平台</a>
      </nav>
      <button class="search-toggle" aria-label="搜索平台">
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          aria-hidden="true"
        >
          <circle cx="10" cy="10" r="6.5" />
          <path d="m15 15 6 6" />
        </svg></button
      ><a
        class="account-entry"
        data-login-entry
        target="_blank"
        rel="noopener"
        aria-label="登录原系统（新标签页）"
        >登录 <span aria-hidden="true">↗</span></a
      >

    <main id="main" tabindex="-1"></main>
    <footer>
      <div class="footer-main">

          <a href="#/about">关于平台</a><a href="#/support">使用指南</a>

    <dialog aria-labelledby="search-title">

        <h2 id="search-title">搜索平台</h2>
        <button id="close-search" aria-label="关闭搜索">×</button>
      </div>
      <input
        id="search-input"
        type="search"
        placeholder="搜索应用或使用指南"
        aria-label="搜索关键词"
      />
      <div id="results" aria-live="polite"></div>
    </dialog>
    <script src="portal.js?v=selected-depth-7"></script>
