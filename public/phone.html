<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>手机号登录与账号绑定</title>
<style>body{font:16px system-ui;background:#eef4f7;color:#173746;margin:0}main{max-width:560px;margin:5vh auto;background:#fff;padding:28px;border-radius:16px;border:1px solid #c3d7e2}label{display:block;margin-top:18px}input,select,button{font:inherit;padding:12px;border-radius:6px;box-sizing:border-box}input:not([type=radio]),select{width:100%;margin-top:8px;border:1px solid #b6cbd5}button{background:#0b3446;color:#fff;border:0;margin-top:18px;cursor:pointer}button:disabled{opacity:.5}a{color:#0b617f}#status{white-space:pre-wrap}[hidden]{display:none!important}fieldset{margin-top:18px;border:1px solid #b6cbd5;border-radius:8px}small{display:block;margin-top:8px;color:#526e7b}@media(max-width:620px){main{margin:12px;padding:22px}}</style>
<main><h1 id="title">手机号验证码登录</h1><p id="intro">使用已注册或绑定的手机号登录。</p>
<p><a href="/oauth2/authorization/enterprise?reauthenticate=1">使用原账号密码重新登录</a> · <a href="/register.html">注册普通员工账号</a></p>
<label>办理事项<select id="mode"><option value="LOGIN">手机号登录</option><option value="BIND">为原账号绑定手机号</option><option value="MERGE">将手机账号合并到原账号</option></select></label>
<form id="form"><label>手机号<input id="phone" type="tel" inputmode="tel" autocomplete="tel-national" pattern="1[3-9][0-9]{9}" maxlength="11" required></label><button type="button" id="send">获取验证码</button>
<label>短信验证码<input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></label><button type="submit" id="submit">登录</button></form>
<form id="merge" hidden><h2>确认账号合并</h2><p id="accounts"></p><p>原账号继续使用，手机账号将停用。两个账号的旧会话均会退出；原账号权限保持不变。</p>
<fieldset><legend>请选择保留的负责区域</legend><label><input type="radio" name="choice" value="PHONE" required>保留手机账号区域</label><small id="phoneRegions"></small><label><input type="radio" name="choice" value="ORIGINAL" required>保留原账号区域</label><small id="originalRegions"></small></fieldset><button id="confirm" type="submit">确认合并并退出登录</button></form>
<p id="status" role="status" aria-live="polite"></p><p><a href="/">返回系统</a></p></main>
<script>
const el=id=>document.getElementById(id);let challengeId=null,ticketId=null,busy=false;
async function api(path,body){const token=document.cookie.split('; ').find(x=>x.startsWith('XSRF-TOKEN='))?.slice(11);const r=await fetch('/api/v1/identity/phone/'+path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json','X-XSRF-TOKEN':decodeURIComponent(token||'')}:undefined,body:body?JSON.stringify(body):undefined});let data;try{data=await r.json()}catch{}if(!r.ok)throw new Error(data?.error?.message||(r.status===401?'请先使用原账号密码登录，然后返回此页。':'请求失败，请稍后重试。'));return data.data;}
function reset(){challengeId=null;ticketId=null;el('merge').hidden=true;el('form').hidden=false;el('code').value='';el('status').textContent='';el('title').textContent=el('mode').selectedOptions[0].textContent;el('submit').textContent=el('mode').value==='LOGIN'?'登录':el('mode').value==='BIND'?'验证并绑定':'验证并预览合并';el('intro').textContent=el('mode').value==='LOGIN'?'使用已注册或绑定的手机号登录。':'请先使用需要保留的原账号密码重新登录，再验证手机号。';}
el('mode').onchange=reset;el('phone').oninput=()=>{challengeId=null;ticketId=null;el('merge').hidden=true;};
el('send').onclick=async()=>{if(!el('phone').checkValidity()){el('phone').reportValidity();return;}el('send').disabled=true;const phone=el('phone').value,mode=el('mode').value;try{const d=await api('challenge',{phone,purpose:mode});if(phone===el('phone').value&&mode===el('mode').value)challengeId=d.challengeId;el('status').textContent='验证码已发送，5分钟内有效。';let seconds=60;const timer=setInterval(()=>{el('send').textContent=(--seconds)+'秒后可重发';if(seconds<=0){clearInterval(timer);el('send').disabled=false;el('send').textContent='获取验证码';}},1000);}catch(e){el('status').textContent=e.message;el('send').disabled=false;}};
el('form').onsubmit=async e=>{e.preventDefault();if(busy)return;if(!challengeId){el('status').textContent='请先获取验证码';return;}busy=true;el('submit').disabled=true;el('mode').disabled=true;try{const mode=el('mode').value;const d=await api(mode==='LOGIN'?'login':mode==='BIND'?'bind':'merge-preview',{challengeId,code:el('code').value});challengeId=null;if(mode==='LOGIN'){location.assign('/');return;}if(mode==='BIND'){el('status').textContent='手机号绑定成功，可用于验证码登录。';return;}ticketId=d.ticketId;el('accounts').textContent='手机账号：'+d.phoneAccount+'；保留原账号：'+d.originalAccount;el('phoneRegions').textContent=d.phoneRegions.map(r=>r.name).join('、')||'无有效区域';el('originalRegions').textContent=d.originalRegions.map(r=>r.name).join('、')||'无有效区域';el('merge').reset();el('form').hidden=true;el('merge').hidden=false;el('status').textContent='请选择一方区域，5分钟内确认。';}catch(e){el('status').textContent=e.message;}finally{busy=false;el('submit').disabled=false;el('mode').disabled=false;}};
el('merge').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;el('confirm').disabled=true;try{await api('merge',{ticketId,regionChoice:new FormData(el('merge')).get('choice')});el('merge').hidden=true;el('status').textContent='合并成功，请使用原账号密码或手机号重新登录。';}catch(e){el('status').textContent=e.message;}finally{busy=false;el('confirm').disabled=false;}};
const mode=new URLSearchParams(location.search).get('mode');if(['BIND','MERGE'].includes(mode))el('mode').value=mode;reset();api('bootstrap').catch(e=>el('status').textContent=e.message);
</script></html>
