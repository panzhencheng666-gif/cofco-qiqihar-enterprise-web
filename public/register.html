<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>完善员工资料</title>
  <style>
    body {
      font: 16px system-ui;
      background: #eef4f7;
      color: #173746;
      margin: 0;
    }
    main {
      max-width: 680px;
      margin: 5vh auto;
      background: white;
      padding: 32px;
      border-radius: 16px;
      border: 1px solid #c3d7e2;
    }
    label {
      display: block;
      margin-top: 18px;
      font-weight: 600;
    }
    input,
    select {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border: 1px solid #b6cbd5;
      border-radius: 6px;
      font: inherit;
    }
    button,
    .action {
      display: inline-block;
      background: #0b3446;
      color: white;
      padding: 13px 20px;
      border: 0;
      border-radius: 6px;
      font: inherit;
      margin-top: 20px;
      text-decoration: none;
    }
    button:disabled {
      opacity: 0.5;
    }
    small {
      display: block;
      color: #526e7b;
      margin-top: 8px;
    }
    #status {
      white-space: pre-wrap;
    }
    a {
      color: #0b617f;
    }
    [hidden] {
      display: none !important;
    }
    @media (max-width: 720px) {
      main {
        margin: 12px;
        padding: 22px;
      }
    }
  </style>
  <main>
    <h1>完善员工资料</h1>
    <p>账号注册完成。请补充工作单位和授权地区，完成后即可使用业务功能。</p>
    <section id="login" hidden>
      <p>正在打开注册表单…</p>
      <a class="action" href="/oauth2/authorization/enterprise?register=1"
        >打开注册表单</a
      >
    </section>
    <form id="form" hidden>
      <h2>第2步：员工资料与手机验证</h2>
      <p>账号类型：<strong>普通账号（填报员）</strong></p>
      <label
        >手机号<input
          id="phone"
          type="tel"
          inputmode="tel"
          autocomplete="tel-national"
          pattern="1[3-9][0-9]{9}"
          maxlength="11"
          required /></label
      ><button id="sendSms" type="button" disabled>获取短信验证码</button
      ><label
        >短信验证码<input
          id="smsCode"
          inputmode="numeric"
          autocomplete="one-time-code"
          pattern="[0-9]{6}"
          maxlength="6"
          required
      /></label>
      <label
        >姓名<input id="name" required maxlength="160" autocomplete="name"
      /></label>
      <label>工作单位<select id="unit" required></select></label>
      <p id="catalogStatus" role="status" aria-live="polite">
        正在加载工作单位和授权地区…
      </p>
      <button id="retryOptions" type="button" hidden>重新加载选项</button>
      <label id="positionsLabel" hidden
        >岗位<select id="positions" multiple size="4"></select
      ></label>
      <label
        >授权地区<input
          id="search"
          type="search"
          placeholder="搜索地区名称" /><select
          id="regions"
          multiple
          size="10"
          required
          aria-label="授权地区"
        ></select></label
      ><small
        >可选择多个地区；选项与邀请员工一致，不能选择单位范围外的地区。选择后立即获得普通业务权限，地区负责人仍由管理员安排。</small
      >
      <button id="submit" type="submit">完成注册并进入系统</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <a id="enter" href="/oauth2/authorization/enterprise" hidden
      >重新登录并进入系统</a
    >
    <p><a href="/">返回登录页面</a></p>
  </main>
  <script>
    const el = (id) => document.getElementById(id);
    let catalogReady = false,
      smsCooling = false;
    let generation = 0,
      busy = false,
      challengeId = null;
    function populate(select, items) {
      select.replaceChildren(
        ...items.map((item) => {
          const o = document.createElement("option");
          o.value = item.code;
          o.textContent = item.name;
          return o;
        }),
      );
    }
    async function message(response) {
      try {
        const body = await response.json();
        return body.error?.message || "请求失败，请重试。";
      } catch {
        return "服务暂时不可用，请稍后重试。";
      }
    }
    async function load(unit = "QIQIHAR_BUSINESS") {
      const current = ++generation;
      catalogReady = false;
      el("submit").disabled = true;
      el("sendSms").disabled = true;
      el("regions").disabled = true;
      el("retryOptions").hidden = true;
      el("catalogStatus").textContent = "正在加载工作单位和授权地区…";
      try {
        const response = await fetch(
          "/api/v1/identity/registration/options?workUnitCode=" +
            encodeURIComponent(unit),
        );
        if (current !== generation) return;
        if (response.status === 401) {
          location.replace("/oauth2/authorization/enterprise?register=1");
          return;
        }
        if (!response.ok) {
          throw new Error(await message(response));
        }
        const { data } = await response.json();
        if (current !== generation) return;
        el("login").hidden = true;
        el("form").hidden = false;
        populate(el("unit"), data.workUnits);
        if (!data.workUnits.length) {
          populate(el("regions"), []);
          el("catalogStatus").textContent =
            "暂无可用工作单位，注册暂不可用。请稍后重新加载选项或联系管理员。";
          el("retryOptions").hidden = false;
          return;
        }
        if (!data.workUnits.some((item) => item.code === unit)) {
          return load(data.workUnits[0].code);
        }
        el("unit").value = unit;
        populate(el("positions"), data.positions);
        el("positionsLabel").hidden = !data.positions.length;
        populate(el("regions"), data.regions);
        el("search").value = "";
        catalogReady = data.regions.length > 0;
        el("regions").disabled = !catalogReady;
        el("submit").disabled = !catalogReady;
        el("sendSms").disabled = !catalogReady || smsCooling;
        el("catalogStatus").textContent = catalogReady
          ? "已加载 " + data.regions.length + " 个可选地区，请选择授权地区。"
          : "该单位暂无可选授权地区，请切换工作单位或稍后重试。";
        el("retryOptions").hidden = catalogReady;
      } catch (error) {
        if (current === generation) {
          el("catalogStatus").textContent =
            error.message || "选项加载失败，请重新加载选项。";
          el("retryOptions").hidden = false;
        }
      }
    }
    async function initialize() {
      try {
        // This registration endpoint accepts an OIDC identity before business binding.
        const response = await fetch("/api/v1/identity/registration/phone");
        const body = response.ok ? await response.json() : null;
        if (body?.data?.registered) {
          location.replace("/");
          return;
        }
        if (
          !el("phone").value &&
          /^1[3-9][0-9]{9}$/.test(body?.data?.phone || "")
        ) {
          el("phone").value = body.data.phone;
        }
        await load();
      } catch {
        await load();
      }
    }
    el("phone").oninput = () => {
      challengeId = null;
    };
    el("sendSms").onclick = async () => {
      if (!catalogReady || smsCooling) return;
      if (!el("phone").checkValidity()) {
        el("phone").reportValidity();
        return;
      }
      el("sendSms").disabled = true;
      const requestedPhone = el("phone").value;
      try {
        const token = document.cookie
          .split("; ")
          .find((x) => x.startsWith("XSRF-TOKEN="))
          ?.slice(11);
        const response = await fetch("/api/v1/identity/phone/challenge", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-XSRF-TOKEN": decodeURIComponent(token || ""),
          },
          body: JSON.stringify({ phone: requestedPhone, purpose: "REGISTER" }),
        });
        if (!response.ok) throw new Error(await message(response));
        const sent = (await response.json()).data.challengeId;
        challengeId = requestedPhone === el("phone").value ? sent : null;
        el("status").textContent = challengeId
          ? "验证码已发送，5分钟内有效。"
          : "手机号已更改，请为当前号码重新获取验证码。";
        smsCooling = true;
        setTimeout(() => {
          smsCooling = false;
          el("sendSms").disabled = !catalogReady;
        }, 60000);
      } catch (e) {
        el("status").textContent = e.message;
        el("sendSms").disabled = !catalogReady;
      }
    };
    el("retryOptions").onclick = () =>
      load(el("unit").value || "QIQIHAR_BUSINESS");
    el("unit").onchange = () => load(el("unit").value);
    el("search").oninput = () => {
      for (const o of el("regions").options)
        o.hidden = !o.textContent.includes(el("search").value.trim());
    };
    el("form").onsubmit = async (event) => {
      event.preventDefault();
      if (busy || !catalogReady) return;
      if (!challengeId) {
        el("status").textContent = "请先获取并填写短信验证码";
        return;
      }
      busy = true;
      el("submit").disabled = true;
      el("unit").disabled = true;
      el("status").textContent = "正在创建员工账号…";
      try {
        const token = document.cookie
          .split("; ")
          .find((x) => x.startsWith("XSRF-TOKEN="))
          ?.slice(11);
        const response = await fetch("/api/v1/identity/registration", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-XSRF-TOKEN": decodeURIComponent(token || ""),
          },
          body: JSON.stringify({
            challengeId,
            smsCode: el("smsCode").value,
            displayName: el("name").value.trim(),
            workUnitCode: el("unit").value,
            positionCodes: [...el("positions").selectedOptions].map(
              (o) => o.value,
            ),
            regionCodes: [...el("regions").selectedOptions].map((o) => o.value),
            roleCodes: ["BUSINESS_OPERATOR"],
          }),
        });
        if (response.ok) {
          el("status").textContent = "注册成功，正在进入系统…";
          location.assign("/oauth2/authorization/enterprise");
          return;
        }
        el("status").textContent =
          response.status === 401
            ? "登录已失效，请重新登录后继续。"
            : await message(response);
        el("enter").hidden = false;
      } catch {
        el("status").textContent =
          "连接中断。如果账号已创建，可直接重新登录；重复提交不会创建第二个账号。";
        el("enter").hidden = false;
      } finally {
        busy = false;
        el("submit").disabled = false;
        el("unit").disabled = false;
      }
    };
    if (new URLSearchParams(location.search).has("reauthenticate"))
      location.replace("/oauth2/authorization/enterprise?reauthenticate=1");
    else initialize();
  </script>
</html>
