<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>邮箱验证码登录</title>
  <style>
    body {
      margin: 0;
      background: #eef4f7;
      color: #173746;
      font: 16px system-ui;
    }
    main {
      max-width: 414px;
      margin: 7vh auto;
      padding: 32px;
      border: 1px solid #c3d7e2;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 18px 55px #1737460c;
    }
    h1 {
      margin: 12px 0;
      font-size: 26px;
    }
    .brand,
    #intro {
      color: #526e7b;
      font-size: 14px;
    }
    .brand {
      margin: 0 0 24px;
      font-weight: 600;
    }
    #intro {
      margin-bottom: 24px;
      line-height: 1.6;
    }
    .login-tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 24px;
      padding: 4px;
      border-radius: 9px;
      background: #edf3f6;
    }
    .login-tabs > * {
      flex: 1;
      padding: 10px 4px;
      border-radius: 6px;
      color: #526e7b;
      font-size: 14px;
      text-align: center;
      text-decoration: none;
    }
    .login-tabs [aria-current] {
      background: #fff;
      color: #0b3446;
      font-weight: 600;
      box-shadow: 0 1px 5px #17374612;
    }
    label {
      display: block;
      margin-top: 18px;
      font-size: 14px;
      font-weight: 600;
    }
    input,
    button {
      box-sizing: border-box;
      height: 46px;
      padding: 12px;
      border-radius: 6px;
      font: inherit;
    }
    input {
      width: 100%;
      margin-top: 8px;
      border: 1px solid #b6cbd5;
    }
    input:focus {
      outline: 2px solid #1683a9;
      outline-offset: 2px;
    }
    .code-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .code-row input {
      min-width: 0;
      flex: 1;
    }
    button {
      border: 0;
      background: #0b3446;
      color: #fff;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.5;
    }
    #send {
      margin-top: 8px;
      background: #eaf2f6;
      color: #0b617f;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
    }
    #submit {
      width: 100%;
      margin-top: 26px;
    }
    #status {
      padding: 12px;
      border-radius: 6px;
      background: #f1f6f8;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    #status:empty {
      display: none;
    }
    .footer {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin: 24px 0 0;
      font-size: 14px;
    }
    a {
      color: #0b617f;
    }
    @media (max-width: 620px) {
      main {
        margin: 16px 12px;
        padding: 24px 20px;
      }
      h1 {
        font-size: 24px;
      }
    }
  </style>
  <main>
    <p class="brand">齐齐哈尔粮食商情企业平台</p>
    <h1>登录企业账号</h1>
    <p id="intro">使用已验证的邮箱接收验证码登录。</p>
    <nav class="login-tabs" aria-label="登录方式">
      <a href="/oauth2/authorization/enterprise">账号密码</a>
      <a href="/phone.html">短信验证码</a>
      <span aria-current="page">邮箱验证码</span>
    </nav>
    <form id="form">
      <label>
        邮箱
        <input
          id="email"
          type="email"
          autocomplete="email"
          placeholder="输入已验证邮箱"
          maxlength="254"
          required
        />
      </label>
      <label>
        邮箱验证码
        <span class="code-row">
          <input
            id="code"
            inputmode="numeric"
            autocomplete="one-time-code"
            placeholder="输入6位验证码"
            pattern="[0-9]{6}"
            maxlength="6"
            required
          />
          <button type="button" id="send">获取验证码</button>
        </span>
      </label>
      <button type="submit" id="submit">登录</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <p class="footer">
      <a href="/oauth2/authorization/enterprise?register=1">员工注册</a>
      <span>·</span><a href="/">返回系统</a>
    </p>
  </main>
  <script>
    const element = (id) => document.getElementById(id);
    let challengeId = null;
    let busy = false;

    async function bootstrap() {
      const response = await fetch("/api/v1/identity/email/bootstrap", {
        credentials: "same-origin",
      });
      if (!response.ok) throw new Error("邮箱登录暂不可用，请稍后重试。");
    }

    async function api(path, body) {
      const token = document.cookie
        .split("; ")
        .find((value) => value.startsWith("XSRF-TOKEN="))
        ?.slice(11);
      const response = await fetch("/api/v1/identity/email/" + path, {
        method: "POST",
        credentials: "same-origin",
        headers: {
          "Content-Type": "application/json",
          "X-XSRF-TOKEN": decodeURIComponent(token || ""),
        },
        body: JSON.stringify(body),
      });
      let data;
      try {
        data = await response.json();
      } catch {}
      if (!response.ok) {
        throw new Error(
          data?.error?.message || "请求失败，请核对邮箱或稍后重试。",
        );
      }
      return data.data;
    }

    element("email").oninput = () => {
      challengeId = null;
      element("code").value = "";
    };

    element("send").onclick = async () => {
      if (!element("email").checkValidity()) {
        element("email").reportValidity();
        return;
      }
      element("send").disabled = true;
      const email = element("email").value;
      try {
        await bootstrap();
        const result = await api("challenge", { email, purpose: "LOGIN" });
        if (email === element("email").value) challengeId = result.challengeId;
        element("status").textContent =
          "验证码已发送，5分钟内有效且只能使用一次。";
        let seconds = 60;
        const timer = setInterval(() => {
          seconds -= 1;
          element("send").textContent = seconds + "秒后可重发";
          if (seconds <= 0) {
            clearInterval(timer);
            element("send").disabled = false;
            element("send").textContent = "获取验证码";
          }
        }, 1000);
      } catch (error) {
        element("status").textContent = error.message;
        element("send").disabled = false;
      }
    };

    element("form").onsubmit = async (event) => {
      event.preventDefault();
      if (busy) return;
      if (!challengeId) {
        element("status").textContent = "请先获取验证码。";
        return;
      }
      busy = true;
      element("submit").disabled = true;
      try {
        await api("login", { challengeId, code: element("code").value });
        challengeId = null;
        location.assign("/");
      } catch (error) {
        element("status").textContent = error.message;
      } finally {
        busy = false;
        element("submit").disabled = false;
      }
    };
  </script>
</html>
